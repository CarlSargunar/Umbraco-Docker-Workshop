events { }
http {
    include mime.types;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            # Ask browsers to check for changes before using cached files, so a
            # rebuilt app is picked up instead of running an old cached version.
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html =404;
        }
    }
}
